name: ci

on:
  push:
  pull_request:

jobs:
  adapter-tests:
    name: Adapter contract tests (fake Laya, no downloads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -v
