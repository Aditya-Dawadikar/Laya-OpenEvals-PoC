[project]
name = "laya-openevals-poc"
version = "0.1.0"
description = "Validates the OpenEvals binary-classifier adapter with Laya, a System 1 decision model, judging Llama answers on TruthfulQA."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # The adapter under test: add-binary-classifier-evaluator branch, pinned to a commit
    "openevals @ git+https://github.com/Aditya-Dawadikar/openevals-aditya.git@ab3de271939e2ad94ed6616e704ed9551430f56b#subdirectory=python",
    "laya==0.3.11",
    "torch>=2.4",
    "datasets>=3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
]

[project.scripts]
laya-poc = "laya_openevals_poc.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_openevals_poc"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Keep every download inside the repo (gitignored), never in a global/system cache
cache-dir = ".cache/uv"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
